<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <title>퀴즈쇼 참가</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="player">
  <header>
    <span class="brand"><svg class="ch ch-idle mascot " viewBox="0 0 100 100" aria-hidden="true" style="color:var(--crimson)"> <g fill="currentColor"><circle cx="50" cy="51" r="40"/></g><g class="ch-eyes"><ellipse cx="38" cy="50" rx="7" ry="8.5" fill="#fff"/><ellipse cx="62" cy="50" rx="7" ry="8.5" fill="#fff"/> <circle cx="39" cy="52" r="3.8" fill="#12131A"/><circle cx="63" cy="52" r="3.8" fill="#12131A"/></g></svg><span id="title">퀴즈쇼</span></span>
    <span class="conn" id="conn" title="연결 상태"></span>
    <span class="me hidden" id="me"><span class="me-avatar" id="me-avatar"></span><span id="me-name"></span><button id="rename" type="button">닉네임 변경</button></span>
  </header>
  <nav class="social hidden" id="social" aria-label="댄스와 채팅">
    <form class="chat-row hidden" id="chat-row" autocomplete="off">
      <input id="chat-in" maxlength="40" placeholder="스크린에 띄울 한마디 (40자)" enterkeyhint="send" aria-label="채팅 메시지">
      <button class="btn sm" type="submit">보내기</button>
    </form>
    <div class="react-row">
      <button type="button" data-d="d1">댄스 1<small>흔들흔들</small></button>
      <button type="button" data-d="d2">댄스 2<small>점프 스핀</small></button>
      <button type="button" data-d="d3">댄스 3<small>꿀렁 웨이브</small></button>
      <button type="button" class="chat-btn" id="chat-toggle" aria-label="채팅 열기">💬</button>
    </div>
    <div class="social-msg" id="social-msg" role="status"></div>
  </nav>
  <main id="view">
    <div class="center"><div class="muted">불러오는 중…</div></div>
  </main>
  <script type="module" src="player.js"></script>
</body>
</html>
